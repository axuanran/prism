name: Release Public Prism Packages

on:
  workflow_dispatch:
    inputs:
      npm-tag:
        description: npm dist-tag
        required: true
        default: latest
        type: string
      finalize-only:
        description: Finalize previously built and signed image digests after npm publication
        required: true
        default: false
        type: boolean
      resume-packages:
        description: Resume a partial exact-tarball npm publication after SRI verification
        required: true
        default: false
        type: boolean
      worker-digest:
        description: Exact sha256 Worker digest required for finalize-only recovery
        required: false
        type: string
      host-digest:
        description: Exact sha256 Host digest required for finalize-only recovery
        required: false
        type: string

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: prism
          POSTGRES_PASSWORD: prism
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U prism"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 release line
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 release line
        with:
          version: 11.21.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 release line
        with:
          node-version: 24.20.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Reject conflicting recovery modes
        if: ${{ inputs['finalize-only'] && inputs['resume-packages'] }}
        run: exit 1
      - name: Ref, manifest, and npm version preflight
        if: ${{ !inputs['finalize-only'] && !inputs['resume-packages'] }}
        env:
          RELEASE_NPM_TAG: ${{ inputs['npm-tag'] }}
          RELEASE_REF_PROTECTED: ${{ github.ref_protected }}
        run: >-
          node scripts/release-preflight.mjs
          --mode release
          --ref "$GITHUB_REF"
          --ref-protected "$RELEASE_REF_PROTECTED"
          --npm-tag "$RELEASE_NPM_TAG"
      - name: Partial npm publication recovery preflight
        if: ${{ inputs['resume-packages'] && !inputs['finalize-only'] }}
        env:
          RELEASE_NPM_TAG: ${{ inputs['npm-tag'] }}
          RELEASE_REF_PROTECTED: ${{ github.ref_protected }}
        run: >-
          node scripts/release-preflight.mjs
          --mode resume
          --ref "$GITHUB_REF"
          --ref-protected "$RELEASE_REF_PROTECTED"
          --npm-tag "$RELEASE_NPM_TAG"
      - name: Finalization recovery preflight
        if: ${{ inputs['finalize-only'] && !inputs['resume-packages'] }}
        env:
          RELEASE_REF_PROTECTED: ${{ github.ref_protected }}
        run: >-
          node scripts/release-preflight.mjs
          --mode finalize
          --ref "$GITHUB_REF"
          --ref-protected "$RELEASE_REF_PROTECTED"
          --worker-digest "${{ inputs['worker-digest'] }}"
          --host-digest "${{ inputs['host-digest'] }}"
      - run: pnpm install --frozen-lockfile
        if: ${{ !inputs['finalize-only'] }}
      - run: pnpm build:ci
        if: ${{ !inputs['finalize-only'] }}
      - run: pnpm typecheck:ci
        if: ${{ !inputs['finalize-only'] }}
      - run: pnpm lint
        if: ${{ !inputs['finalize-only'] }}
      - name: Run required PostgreSQL tests
        if: ${{ !inputs['finalize-only'] }}
        env:
          PRISM_TEST_DATABASE_URL: postgres://prism:prism@127.0.0.1:55432/postgres
          PRISM_REQUIRE_POSTGRES_TESTS: "1"
        run: pnpm test
      - run: pnpm --filter @prismengine/studio build
        if: ${{ !inputs['finalize-only'] }}
      - name: Prepare public package tarballs
        if: ${{ !inputs['finalize-only'] }}
        run: pnpm release:prepare-packages
      - name: Generate SPDX SBOM
        if: ${{ !inputs['finalize-only'] }}
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0 release line
        with:
          path: .
          format: spdx-json
          output-file: prism-engine.spdx.json
          upload-artifact: false
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3 release line
      - name: Keyless-sign SBOM
        if: ${{ !inputs['finalize-only'] }}
        run: >-
          cosign sign-blob --yes
          --bundle prism-engine.spdx.json.sigstore.json
          prism-engine.spdx.json
      - name: Keyless-sign prepared package evidence
        if: ${{ !inputs['finalize-only'] }}
        run: >-
          cosign sign-blob --yes
          --bundle release/npm/release-packages.json.sigstore.json
          release/npm/release-packages.json
      - name: Read Worker image version
        id: worker-version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3 release line
      - name: Login to GHCR for digest operations
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3 release line
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish isolated Worker image
        if: ${{ !inputs['finalize-only'] }}
        id: worker-build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6 release line
        with:
          context: .
          file: docker/worker.Dockerfile
          outputs: type=image,name=ghcr.io/${{ github.repository }}/worker,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            PRISM_VERSION=${{ steps.worker-version.outputs.version }}
          provenance: mode=max
          sbom: true
      - name: Keyless-sign Worker image
        if: ${{ !inputs['finalize-only'] }}
        run: >-
          cosign sign --yes
          ghcr.io/${{ github.repository }}/worker@${{ steps.worker-build.outputs.digest }}
      - name: Build and publish Production Host image
        if: ${{ !inputs['finalize-only'] }}
        id: host-build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6 release line
        with:
          context: .
          file: docker/host.Dockerfile
          outputs: type=image,name=ghcr.io/${{ github.repository }}/host,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            PRISM_VERSION=${{ steps.worker-version.outputs.version }}
          provenance: mode=max
          sbom: true
      - name: Keyless-sign Production Host image
        if: ${{ !inputs['finalize-only'] }}
        run: >-
          cosign sign --yes
          ghcr.io/${{ github.repository }}/host@${{ steps.host-build.outputs.digest }}
      - name: Verify supplied image signatures
        if: ${{ inputs['finalize-only'] }}
        shell: bash
        run: |
          set -euo pipefail
          IDENTITY="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          cosign verify \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "ghcr.io/${{ github.repository }}/worker@${{ inputs['worker-digest'] }}"
          cosign verify \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "ghcr.io/${{ github.repository }}/host@${{ inputs['host-digest'] }}"
      - name: Record signed image identities
        if: ${{ !inputs['finalize-only'] }}
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_VERSION: ${{ steps.worker-version.outputs.version }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          WORKER_DIGEST: ${{ steps.worker-build.outputs.digest }}
          HOST_DIGEST: ${{ steps.host-build.outputs.digest }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const digest = /^sha256:[0-9a-f]{64}$/u;
          if (!digest.test(process.env.WORKER_DIGEST ?? "") ||
              !digest.test(process.env.HOST_DIGEST ?? "")) {
            throw new Error("Image build returned a noncanonical digest.");
          }
          writeFileSync("release-images.json", `${JSON.stringify({
            version: process.env.RELEASE_VERSION,
            ref: process.env.RELEASE_REF,
            sourceSha: process.env.RELEASE_SOURCE_SHA,
            repository: process.env.RELEASE_REPOSITORY,
            workerDigest: process.env.WORKER_DIGEST,
            hostDigest: process.env.HOST_DIGEST,
          }, null, 2)}\n`, { encoding: "utf8", mode: 0o600 });
          NODE
      - name: Keyless-sign image identity evidence
        if: ${{ !inputs['finalize-only'] }}
        run: >-
          cosign sign-blob --yes
          --bundle release-images.json.sigstore.json
          release-images.json
      - name: Verify custom release evidence
        if: ${{ !inputs['finalize-only'] }}
        shell: bash
        run: |
          set -euo pipefail
          IDENTITY="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          cosign verify-blob \
            --bundle release/npm/release-packages.json.sigstore.json \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            release/npm/release-packages.json
          cosign verify-blob \
            --bundle release-images.json.sigstore.json \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            release-images.json
      - name: Upload signed supply-chain evidence
        if: ${{ !inputs['finalize-only'] }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 release line
        with:
          name: prism-engine-sbom
          path: |
            prism-engine.spdx.json
            prism-engine.spdx.json.sigstore.json
            release-images.json
            release-images.json.sigstore.json
            release/npm/*.tgz
            release/npm/release-packages.json
            release/npm/release-packages.json.sigstore.json
          if-no-files-found: error
          retention-days: 90
      - name: Logout GHCR before npm operations
        run: docker logout ghcr.io
      - name: Verify npm token and @prismengine scope access
        if: ${{ !inputs['finalize-only'] }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          NPM_USER="$(npm whoami --registry=https://registry.npmjs.org)"
          echo "Authenticated to npm as: $NPM_USER"

          if [ "$NPM_USER" != "prismengine" ]; then
            if ! npm org ls prismengine --json > "$RUNNER_TEMP/prismengine-org.json"; then
              echo "::error::The npm token is valid, but @prismengine is not an organization visible to this account."
              echo "::error::Create/join the npm organization 'prismengine', or choose another package scope."
              exit 1
            fi
            node - "$NPM_USER" "$RUNNER_TEMP/prismengine-org.json" <<'NODE'
          const { readFileSync } = require("node:fs");
          const [user, path] = process.argv.slice(2);
          const members = JSON.parse(readFileSync(path, "utf8"));
          if (!Object.prototype.hasOwnProperty.call(members, user)) {
            console.error(`::error::npm user ${user} is not a member of @prismengine.`);
            process.exit(1);
          }
          console.log(`npm scope access PASS: ${user} is a member of @prismengine.`);
          NODE
          fi

          # Token publishes the bootstrap 0.1.0 packages. After they exist,
          # each package can configure release.yml as its Trusted Publisher.
          echo "npm bootstrap authentication PASS."
      # Exact prepared tarballs are published in deterministic dependency order.
      # Existing versions are skipped only after exact registry SRI equality.
      - name: Publish exact Apache-2.0 package tarballs
        if: ${{ !inputs['finalize-only'] }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_NPM_TAG: ${{ inputs['npm-tag'] }}
          RELEASE_REF_PROTECTED: ${{ github.ref_protected }}
        run: >-
          node scripts/release-preflight.mjs
          --mode publish
          --ref "$GITHUB_REF"
          --ref-protected "$RELEASE_REF_PROTECTED"
          --source-sha "$GITHUB_SHA"
          --npm-tag "$RELEASE_NPM_TAG"
      - name: Keyless-sign npm publication result
        if: ${{ always() && !inputs['finalize-only'] && hashFiles('release/npm/publication-result.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle release/npm/publication-result.json.sigstore.json \
            release/npm/publication-result.json
          IDENTITY="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          cosign verify-blob \
            --bundle release/npm/publication-result.json.sigstore.json \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            release/npm/publication-result.json
      - name: Upload npm publication recovery evidence
        if: ${{ always() && !inputs['finalize-only'] }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 release line
        with:
          name: prism-engine-publication-result
          path: |
            release/npm/publication-result.json
            release/npm/publication-result.json.sigstore.json
          if-no-files-found: warn
          retention-days: 90

      - name: Smoke-install public distribution from a clean directory
        shell: bash
        # Deliberately anonymous: this proves a third party can install the
        # packages, not merely that the publishing token can read them.
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./packages/platform/package.json').version")"
          mapfile -t PACKAGES < <(node -e "
            const fs = require('node:fs');
            for (const dir of fs.readdirSync('packages')) {
              const path = 'packages/' + dir + '/package.json';
              if (!fs.existsSync(path)) continue;
              const manifest = require('./' + path);
              if (manifest.private !== true) console.log(manifest.name);
            }
          ")
          SMOKE="$(mktemp -d)"
          cd "$SMOKE"
          printf '{"name":"prism-release-smoke","private":true,"type":"module"}\n' > package.json

          # npm package documents and tarballs are eventually consistent.
          # Publishing has already succeeded at this point, so a short smoke
          # timeout must not falsely report the release itself as failed.
          visible=false
          for attempt in $(seq 1 20); do
            visible=true
            for package in "${PACKAGES[@]}"; do
              if ! npm pack "$package@$VERSION" --dry-run --json >/dev/null 2>&1; then
                visible=false
                echo "Registry tarball missing $package@$VERSION (attempt $attempt/20)."
                break
              fi
            done
            if [ "$visible" = true ]; then
              break
            fi
            sleep 30
          done
          if [ "$visible" != true ]; then
            echo "Published package tarballs remained unavailable for ten minutes." >&2
            exit 1
          fi

          installed=false
          for attempt in $(seq 1 20); do
            rm -rf node_modules pnpm-lock.yaml
            if pnpm add \
              --force \
              --store-dir "$SMOKE/store-$attempt" \
              "@prismengine/platform@$VERSION" \
              "@prismengine/plugin-sdk@$VERSION" \
              "@prismengine/testing@$VERSION"; then
              installed=true
              break
            fi
            echo "Clean dependency graph not installable yet (attempt $attempt/20)."
            sleep 30
          done
          if [ "$installed" != true ]; then
            echo "Published dependency graph remained unavailable for ten minutes." >&2
            exit 1
          fi
          pnpm peers check

          node --input-type=module <<'NODE'
          import { prismPlatform, PRISM_PLATFORM_VERSION } from "@prismengine/platform";
          import { readFileSync, existsSync } from "node:fs";
          import { dirname, join } from "node:path";
          import { fileURLToPath } from "node:url";

          const plugins = prismPlatform();
          const ids = plugins.map((plugin) => plugin.id);
          for (const required of [
            "storage.memory",
            "calculation.memory",
            "type.quantity",
            "dataset.grain",
            "project.material-registry",
          ]) {
            if (!ids.includes(required)) {
              throw new Error(`Platform composition omits ${required}.`);
            }
          }

          const entry = fileURLToPath(import.meta.resolve("@prismengine/platform"));
          const root = join(dirname(entry), "..");
          for (const file of ["LICENSE", "NOTICE"]) {
            if (!existsSync(join(root, file))) {
              throw new Error(`Installed platform package omits ${file}.`);
            }
          }
          const manifest = JSON.parse(readFileSync(join(root, "package.json"), "utf8"));
          for (const [name, version] of Object.entries(manifest.dependencies ?? {})) {
            if (/^(workspace|file|link|git|https?):/i.test(String(version))) {
              throw new Error(`Installed dependency ${name} leaked ${version}.`);
            }
            if (version !== manifest.version) {
              throw new Error(`Installed dependency ${name} is ${version}; expected release ${manifest.version}.`);
            }
          }
          console.log(`Registry smoke PASS: platform ${PRISM_PLATFORM_VERSION}; ${ids.join(", ")}`);
          NODE
      - name: Login to GHCR for final tags
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3 release line
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Finalize Worker and Host release tags
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.worker-version.outputs.version }}"
          WORKER_DIGEST="${{ inputs['finalize-only'] && inputs['worker-digest'] || steps.worker-build.outputs.digest }}"
          HOST_DIGEST="${{ inputs['finalize-only'] && inputs['host-digest'] || steps.host-build.outputs.digest }}"
          docker buildx imagetools create \
            --tag "ghcr.io/${{ github.repository }}/worker:$VERSION" \
            --tag "ghcr.io/${{ github.repository }}/worker:sha-$GITHUB_SHA" \
            "ghcr.io/${{ github.repository }}/worker@$WORKER_DIGEST"
          docker buildx imagetools create \
            --tag "ghcr.io/${{ github.repository }}/host:$VERSION" \
            --tag "ghcr.io/${{ github.repository }}/host:sha-$GITHUB_SHA" \
            "ghcr.io/${{ github.repository }}/host@$HOST_DIGEST"
